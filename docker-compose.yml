version: '3.8'

# =============================================================================
# SkillBridge Enterprise - Multi-Container Orchestration Manifest
# SIH Problem Statement: SIH26044
# =============================================================================

services:
  # MongoDB 6.0 Database with persistent volume storage
  mongo:
    image: mongo:6-jammy
    container_name: skillbridge-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - skillbridge-network

  # Node.js 18 Express Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillbridge-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/skillbridge_ayush
      - JWT_SECRET=supersecret_skillbridge_ayush_sih2026_jwt_key_98765
      - JWT_EXPIRE=30d
      - ALLOWED_ORIGINS=http://localhost,http://localhost:5173,http://localhost:80,http://127.0.0.1
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - skillbridge-network

  # Multi-Stage Vite React Frontend with Alpine Nginx Reverse Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skillbridge-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - skillbridge-network

volumes:
  mongo-data:
    driver: local

networks:
  skillbridge-network:
    driver: bridge
